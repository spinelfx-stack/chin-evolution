<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ちんちん進化クリッカー</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:linear-gradient(135deg,#ffe0f0 0%,#fff0e0 100%);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-family:'Hiragino Maru Gothic Pro','Rounded Mplus 1c',sans-serif;
  overflow:hidden;touch-action:manipulation;user-select:none;transition:background 0.8s;
}
.title{font-size:1.35rem;font-weight:bold;color:#e060b0;margin-bottom:.2rem}
.stage-label{font-size:.72rem;color:#aa88aa;min-height:.9rem}
.form-name{font-size:1.15rem;font-weight:bold;min-height:1.6rem;transition:color .4s}
.rarity-badge{display:inline-block;font-size:.65rem;padding:.1rem .45rem;border-radius:999px;
  font-weight:bold;margin-left:.35rem;vertical-align:middle}
.rarity-N{background:#dde;color:#446}
.rarity-R{background:#ffd;color:#840}
.rarity-SR{background:linear-gradient(90deg,#ffd700,#ff8c00);color:#fff}
.rarity-SP{background:linear-gradient(90deg,#cc00ff,#ff00cc);color:#fff}
.next-info{font-size:.75rem;color:#cc88aa;margin:.1rem 0 .25rem;min-height:1rem}
.prog-wrap{width:175px;height:7px;background:rgba(255,100,180,.15);border-radius:999px;overflow:hidden;margin-bottom:.25rem}
.prog-bar{height:100%;background:linear-gradient(90deg,#ff90c0,#ff2080);border-radius:999px;width:0%;transition:width .22s}
.stage-area{width:196px;height:262px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.character{width:158px;height:256px;transform-origin:bottom center;filter:drop-shadow(0 7px 16px rgba(255,100,150,.35));transition:filter .4s}
.character.wiggle{animation:wiggle .5s ease}
@keyframes wiggle{
  0%{transform:rotate(0)scaleX(1)}10%{transform:rotate(-18deg)scaleX(.85)}
  25%{transform:rotate(22deg)scaleX(1.1)}40%{transform:rotate(-16deg)scaleX(.9)}
  55%{transform:rotate(14deg)scaleX(1.08)}70%{transform:rotate(-10deg)scaleX(.95)}
  85%{transform:rotate(6deg)scaleX(1.02)}100%{transform:rotate(0)scaleX(1)}
}
.character.evolving{animation:evolve .88s cubic-bezier(.2,.8,.4,1)}
@keyframes evolve{
  0%{transform:scale(.3)rotate(-15deg);opacity:.3;filter:brightness(4)}
  25%{transform:scale(1.35)rotate(6deg);opacity:1;filter:brightness(2.5)}
  55%{transform:scale(.93)rotate(-2deg);filter:brightness(1.3)}
  100%{transform:scale(1)rotate(0);filter:brightness(1)}
}
.stat-row{font-size:.7rem;color:#886699;margin:.1rem 0;min-height:.95rem;letter-spacing:.02em}
.stat-row b{color:#cc2288}
.bonus-text{color:#ff8800;font-size:.65rem}
.count-display{font-size:1.1rem;color:#cc4488;font-weight:bold;margin-top:.15rem}
.hint{font-size:.75rem;color:#cc88aa;margin-top:.15rem}
.controls{display:flex;gap:.4rem;margin-top:.4rem;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{padding:.35rem .8rem;border:none;border-radius:999px;font-size:.82rem;font-weight:bold;
  cursor:pointer;font-family:inherit;transition:transform .1s,box-shadow .1s}
.btn:active{transform:scale(.93)}
.btn-auto{background:linear-gradient(135deg,#66cc88,#22aa55);color:#fff;box-shadow:0 3px 10px rgba(50,180,80,.4)}
.btn-auto.on{background:linear-gradient(135deg,#cc4444,#aa1111)}
.btn-reset{background:linear-gradient(135deg,#8888cc,#5555aa);color:#fff;box-shadow:0 3px 10px rgba(80,80,180,.4)}
.btn-zukan{background:linear-gradient(135deg,#ff8833,#cc5500);color:#fff;box-shadow:0 3px 10px rgba(200,100,0,.4)}
.btn-reincarn{background:linear-gradient(135deg,#cc44ff,#6600cc);color:#fff;box-shadow:0 3px 12px rgba(150,0,255,.45);
  animation:glowPulse 2s infinite}
@keyframes glowPulse{0%,100%{box-shadow:0 3px 12px rgba(150,0,255,.45)}50%{box-shadow:0 3px 20px rgba(200,0,255,.8)}}
.speed-sel{font-size:.75rem;padding:.28rem .45rem;border-radius:8px;border:1.5px solid #ccaadd;
  background:#fff;color:#664488;font-family:inherit;cursor:pointer}
.reincarn-row{display:none;flex-direction:column;align-items:center;margin-top:.3rem}
.reincarn-row.visible{display:flex}
.reincarn-info{font-size:.7rem;color:#aa44cc;margin-top:.2rem}
.puchi{position:fixed;pointer-events:none;font-weight:bold;animation:floatUp 1.1s cubic-bezier(.2,.8,.4,1) forwards;z-index:100;white-space:nowrap}
@keyframes floatUp{
  0%{opacity:0;transform:scale(.3)translateY(0)rotate(-8deg)}
  15%{opacity:1;transform:scale(1.25)translateY(-10px)rotate(6deg)}
  35%{opacity:1;transform:scale(1)translateY(-30px)rotate(-3deg)}
  70%{opacity:.8;transform:scale(.95)translateY(-70px)rotate(2deg)}
  100%{opacity:0;transform:scale(.7)translateY(-120px)rotate(-5deg)}
}
.evolve-banner{
  position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);
  background:linear-gradient(135deg,#ff5090,#cc0080);color:#fff;
  font-size:1.5rem;font-weight:bold;padding:.65rem 1.5rem;border-radius:16px;
  box-shadow:0 8px 28px rgba(255,0,120,.5);pointer-events:none;
  animation:bannerAnim 2.4s ease forwards;z-index:200;text-align:center;line-height:1.4
}
@keyframes bannerAnim{
  0%{opacity:0;transform:translate(-50%,-50%)scale(.3)}
  18%{opacity:1;transform:translate(-50%,-50%)scale(1.12)}
  38%{transform:translate(-50%,-50%)scale(.96)}
  72%{opacity:1;transform:translate(-50%,-50%)scale(1)}
  100%{opacity:0;transform:translate(-50%,-60%)scale(1.06)}
}
/* 図鑑モーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;
  align-items:flex-start;justify-content:center;z-index:300;overflow-y:auto;padding:1rem 0}
.modal-overlay.hidden{display:none}
.modal{background:#fff9fc;border-radius:20px;padding:1rem;max-width:400px;width:95%;
  box-shadow:0 12px 48px rgba(0,0,0,.3);margin:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
.modal-title{font-size:1.2rem;font-weight:bold;color:#cc2288}
.modal-close{background:#eee;border:none;border-radius:50%;width:28px;height:28px;
  font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.zukan-count{font-size:.8rem;color:#886699;margin-bottom:.4rem}
.stage-group-title{font-size:.78rem;font-weight:bold;color:#aa4488;margin:.55rem 0 .25rem;
  border-bottom:1.5px solid #f0c0e0;padding-bottom:.18rem}
.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem;margin-bottom:.25rem}
.form-card{border-radius:10px;padding:.25rem .15rem;text-align:center;cursor:default;
  border:2px solid transparent;transition:border-color .2s;background:#fff0f8}
.form-card.discovered{border-color:#ffaacc}
.form-card.undiscovered{background:#f0f0f0;opacity:.72}
.form-card svg{width:48px;height:66px;display:block;margin:0 auto}
.fc-name{font-size:.54rem;color:#884466;margin-top:.15rem;word-break:break-all;line-height:1.2;min-height:1.7em}
.form-card.undiscovered .fc-name{color:#aaa}
.fc-rar{font-size:.58rem;margin-top:.08rem}
.fc-stats{font-size:.5rem;color:#886699;margin-top:.08rem;line-height:1.4}
.form-card.undiscovered .fc-stats{color:#bbb}
.fc-hint{font-size:.5rem;color:#cc44aa;margin-top:.1rem;font-style:italic;line-height:1.3;background:#fff0f8;border-radius:4px;padding:.1rem .2rem}

/* ── 命名 ── */
.name-row{display:flex;align-items:center;gap:.4rem;margin:.15rem 0}
.name-input{font-size:.85rem;padding:.25rem .55rem;border:1.5px solid #ffaad0;border-radius:999px;
  width:120px;font-family:inherit;color:#cc2266;background:#fff8fc;outline:none}
.name-input:focus{border-color:#ff4499}
.name-save{font-size:.75rem;padding:.22rem .65rem;border:none;border-radius:999px;
  background:#ff66aa;color:#fff;cursor:pointer;font-family:inherit}

/* ── NPC対戦 ── */
.btn-battle{background:linear-gradient(135deg,#ff5533,#cc2200);color:#fff;box-shadow:0 3px 10px rgba(220,80,0,.4)}
.b-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;
  justify-content:center;z-index:300;overflow-y:auto;padding:.8rem 0}
.b-overlay.hidden{display:none}
.b-modal{background:#1a0a20;border-radius:18px;padding:.9rem;max-width:400px;width:95%;
  box-shadow:0 12px 48px rgba(0,0,0,.5);margin:auto;color:#eeddff}
.b-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
.b-title{font-size:1.15rem;font-weight:bold;color:#ff88cc}
.b-close{background:#333;border:none;border-radius:50%;width:27px;height:27px;color:#eee;
  font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.npc-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.npc-card{background:#2a1030;border:1.5px solid #553355;border-radius:12px;padding:.5rem;
  cursor:pointer;transition:border-color .2s,transform .1s;text-align:center}
.npc-card:hover{border-color:#ff66cc;transform:scale(1.03)}
.npc-card svg{width:56px;height:72px;display:block;margin:0 auto}
.npc-name{font-size:.75rem;font-weight:bold;color:#ffaadd;margin-top:.2rem}
.npc-diff{font-size:.7rem;margin:.1rem 0}
.npc-desc{font-size:.58rem;color:#cc99bb;line-height:1.3}
.npc-stats{font-size:.58rem;color:#aa88cc;margin-top:.15rem}
.b-fighters{display:flex;justify-content:space-between;align-items:flex-start;gap:.4rem;margin-bottom:.5rem}
.b-fighter{flex:1;text-align:center}
.b-fighter svg{width:60px;height:78px;display:block;margin:0 auto}
.b-fname{font-size:.7rem;font-weight:bold;color:#ffaadd;margin:.15rem 0 .1rem;word-break:break-all}
.hp-wrap{background:#330022;border-radius:999px;height:10px;overflow:hidden;margin-bottom:.12rem}
.hp-fill{height:100%;border-radius:999px;transition:width .4s ease;background:linear-gradient(90deg,#ff4466,#ff0033)}
.hp-fill.npc{background:linear-gradient(90deg,#aa44ff,#6600cc)}
.hp-txt{font-size:.62rem;color:#cc88aa}
.b-vs{font-size:1.4rem;font-weight:bold;color:#ff88cc;align-self:center;flex:0}
.b-log{background:#110818;border-radius:10px;padding:.5rem .6rem;height:150px;overflow-y:auto;
  font-size:.7rem;line-height:1.7;margin-bottom:.5rem}
.b-log-entry{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.b-log .atk{color:#ff9966}
.b-log .npc-atk{color:#bb88ff}
.b-log .crit{color:#ffee00;font-weight:bold}
.b-log .round-sep{color:#554466;font-size:.6rem}
.b-result{text-align:center;padding:.6rem;border-radius:12px;margin-bottom:.5rem;font-weight:bold;font-size:1rem}
.b-result.win{background:linear-gradient(135deg,#224400,#335500);color:#aaff44;border:1.5px solid #66aa00}
.b-result.lose{background:linear-gradient(135deg,#440011,#550022);color:#ff8888;border:1.5px solid #aa2244}
.b-result.draw{background:linear-gradient(135deg,#332200,#443300);color:#ffcc44;border:1.5px solid #886600}
.b-btn-row{display:flex;gap:.4rem;justify-content:center}
.b-record{font-size:.7rem;color:#aa88cc;text-align:center;margin-bottom:.5rem}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="title">🍆 ちんちん進化クリッカー 🍆</div>
<div class="stage-label" id="stageLbl"></div>
<div class="form-name" id="formName"></div>
<div class="name-row">
  <input class="name-input" id="nicknameInput" maxlength="12" placeholder="ちんに名前をつける">
  <button class="name-save" id="btnSaveName">決定</button>
</div>
<div class="next-info" id="nextInfo"></div>
<div class="prog-wrap"><div class="prog-bar" id="progBar"></div></div>

<div class="stage-area" id="stageArea">
  <svg class="character" id="character" viewBox="0 0 130 280" xmlns="http://www.w3.org/2000/svg">
    <g id="charG"></g>
  </svg>
</div>

<div class="stat-row" id="statRow"></div>
<div class="count-display">ぺちぺち: <span id="countEl">0</span>回</div>
<div class="hint">タップ / クリックでぺちぺち</div>

<div class="controls">
  <button class="btn btn-auto" id="btnAuto">▶ オート</button>
  <select class="speed-sel" id="speedSel">
    <option value="333">遅</option>
    <option value="100" selected>普</option>
    <option value="40">速</option>
  </select>
  <button class="btn btn-reset" id="btnReset">↺ リセット</button>
  <button class="btn btn-zukan" id="btnZukan">📖 図鑑</button>
  <button class="btn btn-battle" id="btnBattle">⚔️ 対戦</button>
</div>

<div class="reincarn-row" id="reincarnRow">
  <button class="btn btn-reincarn" id="btnReincarn">🔄 転生する</button>
  <div class="reincarn-info" id="reincarnInfo"></div>
</div>

<!-- 対戦モーダル -->
<div class="b-overlay hidden" id="battleOverlay">
  <div class="b-modal">
    <div class="b-header">
      <div class="b-title">⚔️ NPC対戦</div>
      <button class="b-close" id="battleClose">✕</button>
    </div>
    <div class="b-record" id="battleRecord"></div>
    <!-- NPC選択 -->
    <div id="npcSelect">
      <div class="npc-grid" id="npcGrid"></div>
    </div>
    <!-- バトル画面 -->
    <div id="battleScreen" class="hidden">
      <div class="b-fighters">
        <div class="b-fighter" id="bFighterPlayer"></div>
        <div class="b-vs">VS</div>
        <div class="b-fighter" id="bFighterNpc"></div>
      </div>
      <div class="b-log" id="battleLog"></div>
      <div class="b-result hidden" id="battleResult"></div>
      <div class="b-btn-row">
        <button class="btn btn-reset" id="btnRematch" style="display:none">もう一戦</button>
        <button class="btn btn-zukan" id="btnBackNpc">← NPC選択</button>
      </div>
    </div>
  </div>
</div>

<!-- 図鑑モーダル -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">📖 ちんちん図鑑</div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="zukan-count" id="zukanCount"></div>
    <div id="zukanBody"></div>
  </div>
</div>

<script>
const Rd = n => Math.round(n * 10) / 10;

// ── ステージサイズ ──
const SZ = [
  null,
  {hcy:83,hrx:27,hry:23,sx:44,sy:90,sw:42,sh:118,sr:18,b1:52,b2:78,by:215,brx:13,bry:17},
  {hcy:74,hrx:31,hry:27,sx:40,sy:84,sw:50,sh:143,sr:20,b1:49,b2:81,by:234,brx:16,bry:20},
  {hcy:64,hrx:36,hry:31,sx:36,sy:76,sw:58,sh:160,sr:22,b1:46,b2:84,by:243,brx:18,bry:22},
  {hcy:56,hrx:40,hry:34,sx:32,sy:71,sw:66,sh:165,sr:24,b1:42,b2:88,by:245,brx:20,bry:24},
  {hcy:50,hrx:43,hry:37,sx:29,sy:67,sw:72,sh:170,sr:26,b1:39,b2:91,by:247,brx:22,bry:26},
  {hcy:70,hrx:40,hry:35,sx:31,sy:82,sw:68,sh:162,sr:25,b1:42,b2:88,by:252,brx:21,bry:25},
  {hcy:55,hrx:44,hry:38,sx:27,sy:70,sw:76,sh:172,sr:28,b1:37,b2:93,by:251,brx:24,bry:28},
  {hcy:50,hrx:46,hry:40,sx:25,sy:67,sw:80,sh:175,sr:29,b1:34,b2:96,by:250,brx:26,bry:28},
  {hcy:46,hrx:48,hry:42,sx:23,sy:64,sw:84,sh:178,sr:30,b1:31,b2:99,by:252,brx:28,bry:26},
];

// ── SVGレンダラー ──
function eggSVG(f) {
  const c=f.fill||'#ffe8f0', s=f.stroke||'#ffbbcc';
  return `
<ellipse cx="65" cy="145" rx="50" ry="72" fill="${c}" stroke="${s}" stroke-width="3"/>
<ellipse cx="51" cy="131" rx="9" ry="9" fill="white" opacity=".85"/>
<ellipse cx="79" cy="131" rx="9" ry="9" fill="white" opacity=".85"/>
<circle cx="53" cy="133" r="5.5" fill="${f.eyeCol||'#555'}"/>
<circle cx="81" cy="133" r="5.5" fill="${f.eyeCol||'#555'}"/>
<circle cx="55" cy="131" r="2" fill="white"/>
<circle cx="83" cy="131" r="2" fill="white"/>
<path d="M53 150 Q65 162 77 150" fill="none" stroke="${s}" stroke-width="2.5" stroke-linecap="round"/>
<ellipse cx="38" cy="142" rx="10" ry="6" fill="${f.light||'#ffd5e0'}" opacity=".6"/>
<ellipse cx="92" cy="142" rx="10" ry="6" fill="${f.light||'#ffd5e0'}" opacity=".6"/>
<path d="M62 73 L58 86 L68 92 L60 107" fill="none" stroke="${s}" stroke-width="2" stroke-linecap="round"/>
${f.extras||''}`;
}

function chinSVG(sz, f) {
  const {hcy,hrx,hry,sx,sy,sw,sh,sr,b1,b2,by,brx,bry}=sz;
  const fill=f.fill,stroke=f.stroke,light=f.light,ec=f.eyeCol||'#333',expr=f.expr||'cute';
  const ey=Rd(hcy-hry*.28),eo=Rd(hrx*.46),er=Rd(hrx*.3);
  const my=Rd(hcy+hry*.44),jy=Rd(sy+sh*.08);
  let brows='';
  if(expr==='fierce'){
    brows=`<path d="M${Rd(65-eo*1.1)} ${Rd(ey-er*1.3)} Q${Rd(65-eo*.55)} ${Rd(ey-er*2)} ${Rd(65-eo*.1)} ${Rd(ey-er*1.2)}" fill="none" stroke="${stroke}" stroke-width="${Rd(er*.5)}" stroke-linecap="round"/>
<path d="M${Rd(65+eo*.1)} ${Rd(ey-er*1.2)} Q${Rd(65+eo*.55)} ${Rd(ey-er*2)} ${Rd(65+eo*1.1)} ${Rd(ey-er*1.3)}" fill="none" stroke="${stroke}" stroke-width="${Rd(er*.5)}" stroke-linecap="round"/>`;
  } else if(expr==='proud'||expr==='divine'){
    brows=`<path d="M${Rd(65-eo*1.1)} ${Rd(ey-er*1.4)} Q${Rd(65-eo*.55)} ${Rd(ey-er*1.75)} ${Rd(65-eo*.1)} ${Rd(ey-er*1.35)}" fill="none" stroke="${stroke}" stroke-width="${Rd(er*.42)}" stroke-linecap="round"/>
<path d="M${Rd(65+eo*.1)} ${Rd(ey-er*1.35)} Q${Rd(65+eo*.55)} ${Rd(ey-er*1.75)} ${Rd(65+eo*1.1)} ${Rd(ey-er*1.4)}" fill="none" stroke="${stroke}" stroke-width="${Rd(er*.42)}" stroke-linecap="round"/>`;
  }
  const mq=expr==='cute'?my+er*1.6:expr==='proud'||expr==='divine'?my+er*2:my-er*.8;
  const mouth=`<path d="M${Rd(65-eo*.7)} ${my} Q65 ${Rd(mq)} ${Rd(65+eo*.7)} ${my}" fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round"/>`;
  const blush=expr==='cute'?`<ellipse cx="${Rd(65-eo*1.8)}" cy="${Rd(ey+er*.4)}" rx="${Rd(er*1.1)}" ry="${Rd(er*.65)}" fill="${light}" opacity=".65"/>
<ellipse cx="${Rd(65+eo*1.8)}" cy="${Rd(ey+er*.4)}" rx="${Rd(er*1.1)}" ry="${Rd(er*.65)}" fill="${light}" opacity=".65"/>`:'';
  return `
${f.topDeco||''}
<ellipse cx="${b1}" cy="${by}" rx="${brx}" ry="${bry}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>
<ellipse cx="${b2}" cy="${by}" rx="${brx}" ry="${bry}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>
<ellipse cx="65" cy="${hcy}" rx="${hrx}" ry="${hry}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>
<rect x="${sx}" y="${sy}" width="${sw}" height="${sh}" rx="${sr}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>
<ellipse cx="53" cy="${Rd(hcy-hry*.2)}" rx="${Rd(hrx*.5)}" ry="${Rd(hry*.38)}" fill="${light}" opacity=".22"/>
<path d="M${sx-1} ${jy} Q65 ${sy+2} ${sx+sw+1} ${jy}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round"/>
${f.extras||''}
${brows}
<ellipse cx="${Rd(65-eo)}" cy="${ey}" rx="${er}" ry="${Rd(er*.95)}" fill="white" opacity=".9"/>
<ellipse cx="${Rd(65+eo)}" cy="${ey}" rx="${er}" ry="${Rd(er*.95)}" fill="white" opacity=".9"/>
<circle cx="${Rd(65-eo+er*.1)}" cy="${Rd(ey+er*.15)}" r="${Rd(er*.65)}" fill="${ec}"/>
<circle cx="${Rd(65+eo+er*.1)}" cy="${Rd(ey+er*.15)}" r="${Rd(er*.65)}" fill="${ec}"/>
<circle cx="${Rd(65-eo+er*.38)}" cy="${Rd(ey-er*.1)}" r="${Rd(er*.27)}" fill="white"/>
<circle cx="${Rd(65+eo+er*.38)}" cy="${Rd(ey-er*.1)}" r="${Rd(er*.27)}" fill="white"/>
${mouth}${blush}`;
}

function renderForm(f) { return f.si===0 ? eggSVG(f) : chinSVG(SZ[f.si],f); }

// ── 条件チェック ──
function checkCondition(cond) {
  if(!cond) return true;
  const now=new Date();
  switch(cond.type){
    case 'time': return cond.hours.includes(now.getHours());
    case 'dow':  return cond.days.includes(now.getDay());
    case 'reincarn': return reincarnations>=cond.min;
    case 'collect': {
      const targets=FORMS.filter(f=>cond.stages.includes(f.si)&&!f.cond);
      return targets.every(f=>discovered.has(f.id));
    }
    case 'friday_night': return now.getDay()===5&&[20,21,22,23].includes(now.getHours());
    default: return true;
  }
}

// 実ステータス取得（転生ボーナス込み）
function getEffectiveStats(f){
  const mult=1+reincarnBonusPct/100;
  const s=f.stats;
  return {h:Math.round(s.h*mult),a:Math.round(s.a*mult),d:Math.round(s.d*mult),
          s:Math.round(s.s*mult),m:Math.round(s.m*mult)};
}
function getTotalStats(f){ const s=getEffectiveStats(f); return s.h+s.a+s.d+s.s+s.m; }

// ステージ取得
function getStageIdxFor(n){ let s=0; for(let i=0;i<10;i++) if(n>=THRESHOLDS[i]) s=i; return s; }

// 重み付きランダム（条件付きフォーム考慮）
function pickForm(si){
  const pool=STAGE_GROUPS[si];
  const regular=pool.filter(f=>!f.cond);
  const special=pool.filter(f=>f.cond&&checkCondition(f.cond));
  // 特殊条件が満たされていれば20%で登場
  for(const sf of special){ if(Math.random()<0.20) return sf; }
  const total=regular.reduce((a,f)=>a+WEIGHTS[f.rar],0);
  let r=Math.random()*total;
  for(const f of regular){ r-=WEIGHTS[f.rar]; if(r<=0) return f; }
  return regular[regular.length-1];
}

// ── バトルロジック ──
function simulateBattle(player, npc) {
  let pH = player.stats.h, nH = npc.stats.h;
  const maxPH = pH, maxNH = nH;
  const log = [];

  const attack = (atk, defDef, rng) => {
    const crit = rng() < atk.stats.m / 180;
    let dmg = Math.max(1, Math.round(atk.stats.a - defDef * 0.5));
    if (crit) dmg = Math.round(dmg * 2);
    return { dmg, crit };
  };

  // シード乱数（再現性あり）
  let seed = player.stats.h + player.stats.a + npc.stats.h + npc.stats.a + 12345;
  const rng = () => { seed = (seed * 1664525 + 1013904223) & 0x7fffffff; return seed / 0x7fffffff; };

  const pFirst = player.stats.s >= npc.stats.s;
  const pDouble = player.stats.s >= npc.stats.s * 1.5;
  const nDouble = npc.stats.s >= player.stats.s * 1.5;

  for (let round = 1; round <= 35 && pH > 0 && nH > 0; round++) {
    log.push({ type:'sep', round });
    const doAttack = (isPlayer) => {
      if (pH <= 0 || nH <= 0) return;
      if (isPlayer) {
        const r = attack(player, npc.stats.d, rng);
        nH = Math.max(0, nH - r.dmg);
        log.push({ type:'atk', by:'p', dmg:r.dmg, crit:r.crit, pH, nH, maxPH, maxNH });
      } else {
        const r = attack(npc, player.stats.d, rng);
        pH = Math.max(0, pH - r.dmg);
        log.push({ type:'atk', by:'n', dmg:r.dmg, crit:r.crit, pH, nH, maxPH, maxNH });
      }
    };
    if (pFirst) {
      doAttack(true);
      if (pDouble) doAttack(true);
      doAttack(false);
      if (nDouble) doAttack(false);
    } else {
      doAttack(false);
      if (nDouble) doAttack(false);
      doAttack(true);
      if (pDouble) doAttack(true);
    }
  }
  const winner = pH > nH ? 'player' : pH < nH ? 'npc' : 'draw';
  return { log, winner, pH: Math.max(0,pH), nH: Math.max(0,nH) };
}

  const bs = document.getElementById('battleScreen');
  bs.classList.remove('hidden');
  document.getElementById('battleResult').classList.add('hidden');
  document.getElementById('btnRematch').style.display = 'none';
  document.getElementById('battleLog').innerHTML = '';

  const playerStats = getEffectiveStats(currentForm);
  const playerFighter = { stats: playerStats };
  const npcFighter = { stats: npc.stats };

  const playerName = chinNickname || currentForm.name;
  document.getElementById('bFighterPlayer').innerHTML = fighterHTML(playerName, currentForm, playerStats, false);
  document.getElementById('bFighterNpc').innerHTML = fighterHTML(npc.name, npc.f, npc.stats, true);

  const result = simulateBattle(playerFighter, npcFighter);
  await animateBattle(result, playerName, npc.name, playerStats.h, npc.stats.h);

  // 結果
  const resEl = document.getElementById('battleResult');
  resEl.classList.remove('hidden');
  if (result.winner === 'player') {
    resEl.className = 'b-result win';
    resEl.textContent = `🎉 ${playerName} の勝利！`;
    battleWins++; localStorage.setItem('b_wins', battleWins);
  } else if (result.winner === 'npc') {
    resEl.className = 'b-result lose';
    resEl.textContent = `💀 ${npc.name} の勝利…`;
    battleLosses++; localStorage.setItem('b_losses', battleLosses);
  } else {
    resEl.className = 'b-result draw';
    resEl.textContent = '🤝 引き分け！';
  }
  updateBattleRecord();
  document.getElementById('btnRematch').style.display = 'inline-block';
}

async function animateBattle(result, pName, nName, maxPH, maxNH) {
  const log = document.getElementById('battleLog');
  const delay = ms => new Promise(r => setTimeout(r, ms));
  for (const e of result.log) {
    await delay(e.type==='sep' ? 80 : 380);
    if (e.type === 'sep') {
      const d = document.createElement('div');
      d.className = 'round-sep b-log-entry';
      d.textContent = `── Round ${e.round} ──`;
      log.appendChild(d); log.scrollTop = log.scrollHeight; continue;
    }
    const d = document.createElement('div');
    d.className = 'b-log-entry ' + (e.by==='p' ? 'atk' : 'npc-atk');
    const who = e.by==='p' ? pName : nName;
    const target = e.by==='p' ? nName : pName;
    const critTxt = e.crit ? ' <span class="crit">💥 CRIT!</span>' : '';
    d.innerHTML = `⚔️ <b>${who}</b> → ${target} <b>-${e.dmg}</b>${critTxt}`;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
    // HPバー更新
    document.getElementById('playerHpBar').style.width = (e.pH / maxPH * 100) + '%';
    document.getElementById('playerHpTxt').textContent = `${e.pH}/${maxPH}`;
    document.getElementById('npcHpBar').style.width = (e.nH / maxNH * 100) + '%';
    document.getElementById('npcHpTxt').textContent = `${e.nH}/${maxNH}`;
  }
}

// バトルモーダルイベント
document.getElementById('btnBattle').addEventListener('click', () => {
  renderNpcGrid();
  updateBattleRecord();
  document.getElementById('npcSelect').classList.remove('hidden');
  document.getElementById('battleScreen').classList.add('hidden');
  document.getElementById('battleOverlay').classList.remove('hidden');
});
document.getElementById('battleClose').addEventListener('click', () =>
  document.getElementById('battleOverlay').classList.add('hidden'));
document.getElementById('battleOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('battleOverlay'))
    document.getElementById('battleOverlay').classList.add('hidden');
});
document.getElementById('btnBackNpc').addEventListener('click', () => {
  document.getElementById('battleScreen').classList.add('hidden');
  document.getElementById('npcSelect').classList.remove('hidden');
});
document.getElementById('btnRematch').addEventListener('click', () => {
  if (currentNpc) startBattle(currentNpc);
});

// ── 初期化 ──
applyForm(FORMS[0],false);
applyNickname();
updateUI();
</script>
</body>
