<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ちんちん進化クリッカー</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:linear-gradient(135deg,#ffe0f0 0%,#fff0e0 100%);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-family:'Hiragino Maru Gothic Pro','Rounded Mplus 1c',sans-serif;
  overflow:hidden;touch-action:manipulation;user-select:none;transition:background 0.8s;
}
.title{font-size:1.35rem;font-weight:bold;color:#e060b0;margin-bottom:.2rem}
.stage-label{font-size:.72rem;color:#aa88aa;min-height:.9rem}
.form-name{font-size:1.15rem;font-weight:bold;min-height:1.6rem;transition:color .4s}
.rarity-badge{display:inline-block;font-size:.65rem;padding:.1rem .45rem;border-radius:999px;
  font-weight:bold;margin-left:.35rem;vertical-align:middle}
.rarity-N{background:#dde;color:#446}
.rarity-R{background:#ffd;color:#840}
.rarity-SR{background:linear-gradient(90deg,#ffd700,#ff8c00);color:#fff}
.rarity-SP{background:linear-gradient(90deg,#cc00ff,#ff00cc);color:#fff}
.next-info{font-size:.75rem;color:#cc88aa;margin:.1rem 0 .25rem;min-height:1rem}
.prog-wrap{width:175px;height:7px;background:rgba(255,100,180,.15);border-radius:999px;overflow:hidden;margin-bottom:.25rem}
.prog-bar{height:100%;background:linear-gradient(90deg,#ff90c0,#ff2080);border-radius:999px;width:0%;transition:width .22s}
.stage-area{width:196px;height:262px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.character{width:158px;height:256px;transform-origin:bottom center;filter:drop-shadow(0 7px 16px rgba(255,100,150,.35));transition:filter .4s}
.character.wiggle{animation:wiggle .5s ease}
@keyframes wiggle{
  0%{transform:rotate(0)scaleX(1)}10%{transform:rotate(-18deg)scaleX(.85)}
  25%{transform:rotate(22deg)scaleX(1.1)}40%{transform:rotate(-16deg)scaleX(.9)}
  55%{transform:rotate(14deg)scaleX(1.08)}70%{transform:rotate(-10deg)scaleX(.95)}
  85%{transform:rotate(6deg)scaleX(1.02)}100%{transform:rotate(0)scaleX(1)}
}
.character.evolving{animation:evolve .88s cubic-bezier(.2,.8,.4,1)}
@keyframes evolve{
  0%{transform:scale(.3)rotate(-15deg);opacity:.3;filter:brightness(4)}
  25%{transform:scale(1.35)rotate(6deg);opacity:1;filter:brightness(2.5)}
  55%{transform:scale(.93)rotate(-2deg);filter:brightness(1.3)}
  100%{transform:scale(1)rotate(0);filter:brightness(1)}
}
.stat-row{font-size:.7rem;color:#886699;margin:.1rem 0;min-height:.95rem;letter-spacing:.02em}
.stat-row b{color:#cc2288}
.bonus-text{color:#ff8800;font-size:.65rem}
.count-display{font-size:1.1rem;color:#cc4488;font-weight:bold;margin-top:.15rem}
.hint{font-size:.75rem;color:#cc88aa;margin-top:.15rem}
.controls{display:flex;gap:.4rem;margin-top:.4rem;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{padding:.35rem .8rem;border:none;border-radius:999px;font-size:.82rem;font-weight:bold;
  cursor:pointer;font-family:inherit;transition:transform .1s,box-shadow .1s}
.btn:active{transform:scale(.93)}
.btn-auto{background:linear-gradient(135deg,#66cc88,#22aa55);color:#fff;box-shadow:0 3px 10px rgba(50,180,80,.4)}
.btn-auto.on{background:linear-gradient(135deg,#cc4444,#aa1111)}
.btn-reset{background:linear-gradient(135deg,#8888cc,#5555aa);color:#fff;box-shadow:0 3px 10px rgba(80,80,180,.4)}
.btn-zukan{background:linear-gradient(135deg,#ff8833,#cc5500);color:#fff;box-shadow:0 3px 10px rgba(200,100,0,.4)}
.btn-reincarn{background:linear-gradient(135deg,#cc44ff,#6600cc);color:#fff;box-shadow:0 3px 12px rgba(150,0,255,.45);
  animation:glowPulse 2s infinite}
@keyframes glowPulse{0%,100%{box-shadow:0 3px 12px rgba(150,0,255,.45)}50%{box-shadow:0 3px 20px rgba(200,0,255,.8)}}
.speed-sel{font-size:.75rem;padding:.28rem .45rem;border-radius:8px;border:1.5px solid #ccaadd;
  background:#fff;color:#664488;font-family:inherit;cursor:pointer}
.reincarn-row{display:none;flex-direction:column;align-items:center;margin-top:.3rem}
.reincarn-row.visible{display:flex}
.reincarn-info{font-size:.7rem;color:#aa44cc;margin-top:.2rem}
.puchi{position:fixed;pointer-events:none;font-weight:bold;animation:floatUp 1.1s cubic-bezier(.2,.8,.4,1) forwards;z-index:100;white-space:nowrap}
@keyframes floatUp{
  0%{opacity:0;transform:scale(.3)translateY(0)rotate(-8deg)}
  15%{opacity:1;transform:scale(1.25)translateY(-10px)rotate(6deg)}
  35%{opacity:1;transform:scale(1)translateY(-30px)rotate(-3deg)}
  70%{opacity:.8;transform:scale(.95)translateY(-70px)rotate(2deg)}
  100%{opacity:0;transform:scale(.7)translateY(-120px)rotate(-5deg)}
}
.evolve-banner{
  position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);
  background:linear-gradient(135deg,#ff5090,#cc0080);color:#fff;
  font-size:1.5rem;font-weight:bold;padding:.65rem 1.5rem;border-radius:16px;
  box-shadow:0 8px 28px rgba(255,0,120,.5);pointer-events:none;
  animation:bannerAnim 2.4s ease forwards;z-index:200;text-align:center;line-height:1.4
}
@keyframes bannerAnim{
  0%{opacity:0;transform:translate(-50%,-50%)scale(.3)}
  18%{opacity:1;transform:translate(-50%,-50%)scale(1.12)}
  38%{transform:translate(-50%,-50%)scale(.96)}
  72%{opacity:1;transform:translate(-50%,-50%)scale(1)}
  100%{opacity:0;transform:translate(-50%,-60%)scale(1.06)}
}
/* 図鑑モーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;
  align-items:flex-start;justify-content:center;z-index:300;overflow-y:auto;padding:1rem 0}
.modal-overlay.hidden{display:none}
.modal{background:#fff9fc;border-radius:20px;padding:1rem;max-width:400px;width:95%;
  box-shadow:0 12px 48px rgba(0,0,0,.3);margin:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
.modal-title{font-size:1.2rem;font-weight:bold;color:#cc2288}
.modal-close{background:#eee;border:none;border-radius:50%;width:28px;height:28px;
  font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.zukan-count{font-size:.8rem;color:#886699;margin-bottom:.4rem}
.stage-group-title{font-size:.78rem;font-weight:bold;color:#aa4488;margin:.55rem 0 .25rem;
  border-bottom:1.5px solid #f0c0e0;padding-bottom:.18rem}
.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem;margin-bottom:.25rem}
.form-card{border-radius:10px;padding:.25rem .15rem;text-align:center;cursor:default;
  border:2px solid transparent;transition:border-color .2s;background:#fff0f8}
.form-card.discovered{border-color:#ffaacc}
.form-card.undiscovered{background:#f0f0f0;opacity:.72}
.form-card svg{width:48px;height:66px;display:block;margin:0 auto}
.fc-name{font-size:.54rem;color:#884466;margin-top:.15rem;word-break:break-all;line-height:1.2;min-height:1.7em}
.form-card.undiscovered .fc-name{color:#aaa}
.fc-rar{font-size:.58rem;margin-top:.08rem}
.fc-stats{font-size:.5rem;color:#886699;margin-top:.08rem;line-height:1.4}
.form-card.undiscovered .fc-stats{color:#bbb}
.fc-hint{font-size:.5rem;color:#cc44aa;margin-top:.1rem;font-style:italic;line-height:1.3;background:#fff0f8;border-radius:4px;padding:.1rem .2rem}

/* ── トレーニング ── */
.btn-train{background:linear-gradient(135deg,#33aa55,#116633);color:#fff;box-shadow:0 3px 10px rgba(0,160,80,.4);position:relative}
.train-badge{position:absolute;top:-4px;right:-4px;background:#ff3300;color:#fff;border-radius:50%;width:14px;height:14px;font-size:.55rem;display:flex;align-items:center;justify-content:center;font-weight:bold}
.t-overlay{position:fixed;inset:0;background:rgba(0,20,0,.75);display:flex;align-items:flex-start;justify-content:center;z-index:300;overflow-y:auto;padding:.8rem 0}
.t-overlay.hidden{display:none}
.t-modal{background:#0a1a0a;border-radius:18px;padding:.9rem;max-width:360px;width:95%;box-shadow:0 12px 48px rgba(0,0,0,.5);margin:auto;color:#ccffcc}
.t-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
.t-title{font-size:1.1rem;font-weight:bold;color:#66ff88}
.t-close{background:#1a3a1a;border:none;border-radius:50%;width:27px;height:27px;color:#aaffaa;font-size:.95rem;cursor:pointer}
.t-form-info{font-size:.78rem;color:#88cc88;margin-bottom:.4rem}
.t-prog-wrap{background:#0d2a0d;border-radius:999px;height:12px;overflow:hidden;margin:.3rem 0}
.t-prog-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#22aa44,#88ff44);transition:width .3s}
.t-prog-txt{font-size:.7rem;color:#66aa66;margin-bottom:.5rem}
.t-alloc{background:#0d2a0d;border-radius:12px;padding:.6rem;margin-bottom:.5rem}
.t-alloc-title{font-size:.78rem;color:#aaff88;font-weight:bold;margin-bottom:.4rem}
.t-stat-row{display:flex;align-items:center;justify-content:space-between;margin:.25rem 0}
.t-stat-name{font-size:.75rem;color:#88cc88;width:40px}
.t-stat-bar-wrap{flex:1;background:#0d2a0d;border-radius:999px;height:8px;margin:0 .4rem;overflow:hidden}
.t-stat-bar{height:100%;border-radius:999px;background:#44cc66;transition:width .3s}
.t-stat-val{font-size:.72rem;color:#ccffcc;width:30px;text-align:right}
.t-alloc-btn{padding:.2rem .5rem;font-size:.72rem;border:none;border-radius:999px;background:#226633;color:#88ff88;cursor:pointer;font-family:inherit}
.t-alloc-btn:hover{background:#338844}
.t-alloc-btn:disabled{background:#1a3a1a;color:#446644;cursor:not-allowed}
.t-pending{background:#1a3a00;border:1.5px solid #66ff44;border-radius:10px;padding:.4rem .6rem;margin-bottom:.5rem;font-size:.78rem;color:#aaff44;text-align:center}
.t-bonus-sum{font-size:.68rem;color:#66aa66;text-align:center;margin-top:.3rem}

/* ── 命名（インライン編集ボタン） ── */
.form-name-row{display:flex;align-items:center;gap:.4rem;justify-content:center;min-height:1.6rem}
.name-edit-btn{background:none;border:none;cursor:pointer;font-size:.9rem;opacity:.6;padding:.1rem .2rem;line-height:1}
.name-edit-btn:hover{opacity:1}
.nick-label{font-size:.72rem;color:#cc88aa;font-style:italic}

/* ── アクションバー ── */
.action-bar{width:100%;max-width:360px;display:flex;flex-direction:column;gap:.35rem;margin-top:.35rem}
.main-actions-row{display:flex;gap:.5rem;justify-content:center;align-items:center}
.auto-cluster{display:flex;gap:.25rem;align-items:center}
.icon-bar{display:flex;gap:.3rem;justify-content:center;flex-wrap:wrap}
.icon-btn{
  display:flex;flex-direction:column;align-items:center;gap:.06rem;
  background:rgba(255,100,180,.1);border:1.5px solid rgba(255,100,180,.22);
  border-radius:12px;padding:.38rem .45rem;cursor:pointer;min-width:46px;
  font-size:1.2rem;transition:background .18s,transform .1s;font-family:inherit;
  position:relative
}
.icon-btn:active{transform:scale(.91);background:rgba(255,100,180,.22)}
.icon-btn .ib-label{font-size:.56rem;color:#cc6699;font-weight:bold;line-height:1}
.icon-btn .train-badge{position:absolute;top:-4px;right:-4px;background:#ff3300;color:#fff;
  border-radius:50%;width:13px;height:13px;font-size:.52rem;display:flex;align-items:center;justify-content:center;font-weight:bold}
.reincarn-compact{display:flex;align-items:center;gap:.5rem;justify-content:center}
.btn-reincarn-sm{padding:.35rem 1rem;font-size:.82rem;border:none;border-radius:999px;
  background:linear-gradient(135deg,#cc44ff,#6600cc);color:#fff;cursor:pointer;font-family:inherit;
  box-shadow:0 3px 10px rgba(150,0,255,.4);animation:glowPulse 2s infinite;font-weight:bold}

/* ── 発射 ── */
.btn-shoot{background:linear-gradient(135deg,#4488ff,#1133cc);color:#fff;
  box-shadow:0 4px 16px rgba(30,100,255,.45);font-size:.95rem;padding:.45rem 1.2rem}
.character.shoot{animation:shootRecoil .4s ease}
@keyframes shootRecoil{
  0%{transform:scaleY(1) translateY(0)}
  20%{transform:scaleY(.82) translateY(12px)}
  45%{transform:scaleY(1.12) translateY(-6px)}
  70%{transform:scaleY(.96) translateY(2px)}
  100%{transform:scaleY(1) translateY(0)}
}
.drop{position:fixed;background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.95),#e8e8ff 50%,#ccccee 100%);
  border-radius:50%;pointer-events:none;z-index:50}
.dopyu-text{position:fixed;font-weight:bold;color:#aaaaff;
  animation:dopyuPop 1.4s cubic-bezier(.2,.8,.4,1) forwards;z-index:100;pointer-events:none;white-space:nowrap;
  font-family:'Hiragino Maru Gothic Pro','Rounded Mplus 1c',sans-serif}
@keyframes dopyuPop{
  0%{opacity:0;transform:scale(.2) translateY(0) rotate(-5deg)}
  12%{opacity:1;transform:scale(1.5) translateY(-20px) rotate(4deg)}
  30%{opacity:1;transform:scale(1.1) translateY(-50px) rotate(-2deg)}
  65%{opacity:.9;transform:scale(1) translateY(-110px) rotate(3deg)}
  100%{opacity:0;transform:scale(.8) translateY(-200px) rotate(-4deg)}
}

/* ── アクセサリー ── */
.btn-acc{background:linear-gradient(135deg,#dd44aa,#991166);color:#fff;box-shadow:0 3px 10px rgba(200,0,140,.4)}
.acc-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-start;
  justify-content:center;z-index:300;overflow-y:auto;padding:.8rem 0}
.acc-overlay.hidden{display:none}
.acc-modal{background:#1a0820;border-radius:18px;padding:.9rem;max-width:380px;width:95%;
  box-shadow:0 12px 48px rgba(180,0,120,.3);margin:auto;color:#ffccee}
.acc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
.acc-title{font-size:1.1rem;font-weight:bold;color:#ff88cc}
.acc-close{background:#2a1030;border:none;border-radius:50%;width:27px;height:27px;
  color:#ffaacc;font-size:.95rem;cursor:pointer}
.acc-equipped-row{display:flex;gap:.5rem;margin-bottom:.6rem}
.acc-slot{flex:1;background:#2a1030;border:1.5px solid #553355;border-radius:10px;
  padding:.35rem .2rem;text-align:center;min-height:70px}
.acc-slot-label{font-size:.6rem;color:#aa77aa;margin-bottom:.2rem}
.acc-slot-inner{font-size:.6rem;color:#dd99cc}
.acc-slot svg{width:42px;height:54px;display:block;margin:0 auto}
.acc-tabs{display:flex;gap:.3rem;margin-bottom:.4rem}
.acc-tab{flex:1;padding:.3rem;font-size:.75rem;border:none;border-radius:8px;cursor:pointer;
  font-family:inherit;background:#2a1030;color:#cc88aa;transition:background .2s}
.acc-tab.active{background:#661144;color:#ffaadd}
.acc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.acc-card{background:#2a1030;border:1.5px solid #553355;border-radius:10px;padding:.25rem;
  text-align:center;cursor:pointer;transition:border-color .2s,transform .1s}
.acc-card:hover{border-color:#ff66cc;transform:scale(1.04)}
.acc-card.equipped{border-color:#ff44aa;background:#3a1040}
.acc-card svg{width:48px;height:60px;display:block;margin:0 auto}
.acc-card .ac-name{font-size:.56rem;color:#ffaacc;margin-top:.12rem;word-break:break-all;line-height:1.2}
.acc-card .ac-rar{font-size:.55rem;margin-top:.06rem}
.acc-empty{font-size:.75rem;color:#664466;text-align:center;padding:.8rem 0}
.acc-drop-banner{position:fixed;top:44%;left:50%;transform:translate(-50%,-50%);
  background:linear-gradient(135deg,#881166,#440033);color:#fff;
  font-size:1.3rem;font-weight:bold;padding:.65rem 1.4rem;border-radius:16px;
  box-shadow:0 8px 28px rgba(200,0,120,.5);pointer-events:none;
  animation:bannerAnim 2.4s ease forwards;z-index:210;text-align:center}

/* ── 進化ボタン ── */
.evolve-ready-row{text-align:center;margin:.25rem 0;animation:evolveGlow 1.5s infinite}
@keyframes evolveGlow{0%,100%{opacity:1}50%{opacity:.7}}
.btn-evolve{background:linear-gradient(135deg,#ff44cc,#aa0088);color:#fff;
  font-size:1rem;padding:.5rem 1.4rem;box-shadow:0 4px 16px rgba(255,0,180,.5)}
.evolve-hint{font-size:.7rem;color:#ff88cc;margin-top:.15rem}

/* ── サマリー ── */
.btn-summary{background:linear-gradient(135deg,#4488cc,#115599);color:#fff;box-shadow:0 3px 10px rgba(0,80,180,.4)}
.sum-modal{background:#0a0a1a;border-radius:18px;padding:1rem;max-width:340px;width:95%;
  box-shadow:0 12px 48px rgba(0,0,0,.5);margin:auto;color:#ccddeeff}
.sum-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem}
.sum-title{font-size:1.1rem;font-weight:bold;color:#88aaff}
.sum-row{display:flex;justify-content:space-between;align-items:center;
  padding:.3rem 0;border-bottom:1px solid #1a1a3a;font-size:.82rem}
.sum-row:last-child{border-bottom:none}
.sum-label{color:#8899bb}
.sum-val{color:#eeeeff;font-weight:bold}

/* ── 管理者モード ── */
.admin-tap{position:fixed;top:0;right:0;width:55px;height:55px;z-index:9999;opacity:0;cursor:default;-webkit-tap-highlight-color:transparent}
.admin-modal{background:#1a0a00;border-radius:18px;padding:1rem;max-width:300px;width:92%;
  box-shadow:0 12px 48px rgba(255,80,0,.3);margin:auto;color:#ffccaa}
.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem}
.admin-title{font-size:1rem;font-weight:bold;color:#ff8844}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.3rem}
.btn-admin-action{padding:.45rem;font-size:.78rem;border:none;border-radius:10px;
  background:#2a1500;color:#ffaa66;cursor:pointer;font-family:inherit;text-align:center;border:1px solid #553300}
.btn-admin-action:hover{background:#3a2000}
.admin-stage-sel{width:100%;padding:.35rem;font-size:.82rem;border-radius:8px;
  background:#2a1500;color:#ffaa66;border:1px solid #553300;font-family:inherit;margin-top:.3rem}

/* ── NPC対戦 ── */
.btn-battle{background:linear-gradient(135deg,#ff5533,#cc2200);color:#fff;box-shadow:0 3px 10px rgba(220,80,0,.4)}
.b-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;
  justify-content:center;z-index:300;overflow-y:auto;padding:.8rem 0}
.b-overlay.hidden{display:none}
.b-modal{background:#1a0a20;border-radius:18px;padding:.9rem;max-width:400px;width:95%;
  box-shadow:0 12px 48px rgba(0,0,0,.5);margin:auto;color:#eeddff}
.b-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
.b-title{font-size:1.15rem;font-weight:bold;color:#ff88cc}
.b-close{background:#333;border:none;border-radius:50%;width:27px;height:27px;color:#eee;
  font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.npc-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.npc-card{background:#2a1030;border:1.5px solid #553355;border-radius:12px;padding:.5rem;
  cursor:pointer;transition:border-color .2s,transform .1s;text-align:center}
.npc-card:hover{border-color:#ff66cc;transform:scale(1.03)}
.npc-card svg{width:56px;height:72px;display:block;margin:0 auto}
.npc-name{font-size:.75rem;font-weight:bold;color:#ffaadd;margin-top:.2rem}
.npc-diff{font-size:.7rem;margin:.1rem 0}
.npc-desc{font-size:.58rem;color:#cc99bb;line-height:1.3}
.npc-stats{font-size:.58rem;color:#aa88cc;margin-top:.15rem}
.b-fighters{display:flex;justify-content:space-between;align-items:flex-start;gap:.4rem;margin-bottom:.5rem}
.b-fighter{flex:1;text-align:center}
.b-fighter svg{width:60px;height:78px;display:block;margin:0 auto}
.b-fname{font-size:.7rem;font-weight:bold;color:#ffaadd;margin:.15rem 0 .1rem;word-break:break-all}
.hp-wrap{background:#330022;border-radius:999px;height:10px;overflow:hidden;margin-bottom:.12rem}
.hp-fill{height:100%;border-radius:999px;transition:width .4s ease;background:linear-gradient(90deg,#ff4466,#ff0033)}
.hp-fill.npc{background:linear-gradient(90deg,#aa44ff,#6600cc)}
.hp-txt{font-size:.62rem;color:#cc88aa}
.b-vs{font-size:1.4rem;font-weight:bold;color:#ff88cc;align-self:center;flex:0}
.b-log{background:#110818;border-radius:10px;padding:.5rem .6rem;height:150px;overflow-y:auto;
  font-size:.7rem;line-height:1.7;margin-bottom:.5rem}
.b-log-entry{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.b-log .atk{color:#ff9966}
.b-log .npc-atk{color:#bb88ff}
.b-log .crit{color:#ffee00;font-weight:bold}
.b-log .round-sep{color:#554466;font-size:.6rem}
.b-result{text-align:center;padding:.6rem;border-radius:12px;margin-bottom:.5rem;font-weight:bold;font-size:1rem}

// ── SVGレンダラー ──
function eggSVG(f) {
  const c=f.fill||'#ffe8f0', s=f.stroke||'#ffbbcc';
  return `
<ellipse cx="65" cy="145" rx="50" ry="72" fill="${c}" stroke="${s}" stroke-width="3"/>
<ellipse cx="51" cy="131" rx="9" ry="9" fill="white" opacity=".85"/>
<ellipse cx="79" cy="131" rx="9" ry="9" fill="white" opacity=".85"/>
<circle cx="53" cy="133" r="5.5" fill="${f.eyeCol||'#555'}"/>
<circle cx="81" cy="133" r="5.5" fill="${f.eyeCol||'#555'}"/>
<circle cx="55" cy="131" r="2" fill="white"/>
<circle cx="83" cy="131" r="2" fill="white"/>
<path d="M53 150 Q65 162 77 150" fill="none" stroke="${s}" stroke-width="2.5" stroke-linecap="round"/>
<ellipse cx="38" cy="142" rx="10" ry="6" fill="${f.light||'#ffd5e0'}" opacity=".6"/>
<ellipse cx="92" cy="142" rx="10" ry="6" fill="${f.light||'#ffd5e0'}" opacity=".6"/>
<path d="M62 73 L58 86 L68 92 L60 107" fill="none" stroke="${s}" stroke-width="2" stroke-linecap="round"/>
${f.extras||''}`;
}

function chinSVG(sz, f) {
  const {hcy,hrx,hry,sx,sy,sw,sh,sr,b1,b2,by,brx,bry}=sz;
  const fill=f.fill,stroke=f.stroke,light=f.light,ec=f.eyeCol||'#333',expr=f.expr||'cute';
  const ey=Rd(hcy-hry*.28),eo=Rd(hrx*.46),er=Rd(hrx*.3);
  const my=Rd(hcy+hry*.44),jy=Rd(sy+sh*.08);
  let brows='';
  if(expr==='fierce'){
    brows=`<path d="M${Rd(65-eo*1.1)} ${Rd(ey-er*1.3)} Q${Rd(65-eo*.55)} ${Rd(ey-er*2)} ${Rd(65-eo*.1)} ${Rd(ey-er*1.2)}" fill="none" stroke="${stroke}" stroke-width="${Rd(er*.5)}" stroke-linecap="round"/>
<path d="M${Rd(65+eo*.1)} ${Rd(ey-er*1.2)} Q${Rd(65+eo*.55)} ${Rd(ey-er*2)} ${Rd(65+eo*1.1)} ${Rd(ey-er*1.3)}" fill="none" stroke="${stroke}" stroke-width="${Rd(er*.5)}" stroke-linecap="round"/>`;
  } else if(expr==='proud'||expr==='divine'){
    brows=`<path d="M${Rd(65-eo*1.1)} ${Rd(ey-er*1.4)} Q${Rd(65-eo*.55)} ${Rd(ey-er*1.75)} ${Rd(65-eo*.1)} ${Rd(ey-er*1.35)}" fill="none" stroke="${stroke}" stroke-width="${Rd(er*.42)}" stroke-linecap="round"/>
<path d="M${Rd(65+eo*.1)} ${Rd(ey-er*1.35)} Q${Rd(65+eo*.55)} ${Rd(ey-er*1.75)} ${Rd(65+eo*1.1)} ${Rd(ey-er*1.4)}" fill="none" stroke="${stroke}" stroke-width="${Rd(er*.42)}" stroke-linecap="round"/>`;
  }
  const mq=expr==='cute'?my+er*1.6:expr==='proud'||expr==='divine'?my+er*2:my-er*.8;
  const mouth=`<path d="M${Rd(65-eo*.7)} ${my} Q65 ${Rd(mq)} ${Rd(65+eo*.7)} ${my}" fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round"/>`;
  const blush=expr==='cute'?`<ellipse cx="${Rd(65-eo*1.8)}" cy="${Rd(ey+er*.4)}" rx="${Rd(er*1.1)}" ry="${Rd(er*.65)}" fill="${light}" opacity=".65"/>
<ellipse cx="${Rd(65+eo*1.8)}" cy="${Rd(ey+er*.4)}" rx="${Rd(er*1.1)}" ry="${Rd(er*.65)}" fill="${light}" opacity=".65"/>`:'';
  return `
${f.topDeco||''}
<ellipse cx="${b1}" cy="${by}" rx="${brx}" ry="${bry}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>
<ellipse cx="${b2}" cy="${by}" rx="${brx}" ry="${bry}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>
<ellipse cx="65" cy="${hcy}" rx="${hrx}" ry="${hry}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>
<rect x="${sx}" y="${sy}" width="${sw}" height="${sh}" rx="${sr}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>
<ellipse cx="53" cy="${Rd(hcy-hry*.2)}" rx="${Rd(hrx*.5)}" ry="${Rd(hry*.38)}" fill="${light}" opacity=".22"/>
<path d="M${sx-1} ${jy} Q65 ${sy+2} ${sx+sw+1} ${jy}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round"/>
${f.extras||''}
${brows}
<ellipse cx="${Rd(65-eo)}" cy="${ey}" rx="${er}" ry="${Rd(er*.95)}" fill="white" opacity=".9"/>
<ellipse cx="${Rd(65+eo)}" cy="${ey}" rx="${er}" ry="${Rd(er*.95)}" fill="white" opacity=".9"/>
<circle cx="${Rd(65-eo+er*.1)}" cy="${Rd(ey+er*.15)}" r="${Rd(er*.65)}" fill="${ec}"/>
<circle cx="${Rd(65+eo+er*.1)}" cy="${Rd(ey+er*.15)}" r="${Rd(er*.65)}" fill="${ec}"/>
<circle cx="${Rd(65-eo+er*.38)}" cy="${Rd(ey-er*.1)}" r="${Rd(er*.27)}" fill="white"/>
<circle cx="${Rd(65+eo+er*.38)}" cy="${Rd(ey-er*.1)}" r="${Rd(er*.27)}" fill="white"/>
${mouth}${blush}`;
}

function renderForm(f) { return f.si===0 ? eggSVG(f) : chinSVG(SZ[f.si],f); }

// ── 条件チェック ──
function checkCondition(cond) {
  if(!cond) return true;
  const now=new Date();
  switch(cond.type){
    case 'time':    return cond.hours.includes(now.getHours());
    case 'dow':     return cond.days.includes(now.getDay());
    case 'month':   return cond.months.includes(now.getMonth()+1);
    case 'dom':     return cond.dates.includes(now.getDate());
    case 'month_dom': return cond.months.includes(now.getMonth()+1)&&cond.dates.includes(now.getDate());
    case 'reincarn': return reincarnations>=cond.min;
    case 'collect': {
      const targets=FORMS.filter(f=>cond.stages.includes(f.si)&&!f.cond);
      return targets.every(f=>discovered.has(f.id));
    }
    case 'friday_night': return now.getDay()===5&&[20,21,22,23].includes(now.getHours());
    default: return true;
  }
}

const STAGE_GROUPS = Array.from({length:10},(_,i)=>FORMS.filter(f=>f.si===i));
const THRESHOLDS = [0,10,40,100,250,500,1000,2000,4000,8000];
const STAGE_NAMES = ['たまご','ちびちん','ふつうちん','デカちん','マッチョちん','スーパーちん','ゴールデンちん','神ちん','伝説ちん','レインボーちん'];
const WEIGHTS = {N:3,R:2,SR:1,SP:0}; // SP=条件付き、通常ピックでは選ばない

// ── ゲーム状態 ──
let count=0, currentStageIdx=0, currentForm=FORMS[0];
let reincarnations=+( localStorage.getItem('chin_rei')||'0');
let reincarnBonusPct=+( localStorage.getItem('chin_bonus')||'0');
let discovered=new Set(JSON.parse(localStorage.getItem('chin_disc')||'[]'));
let autoTimer=null;
let canEvolve=false;
let totalManualPechis=+(localStorage.getItem('chin_manual')||'0');
let totalAutoPechis=+(localStorage.getItem('chin_auto')||'0');

function saveAll(){
  localStorage.setItem('chin_disc',JSON.stringify([...discovered]));
  localStorage.setItem('chin_rei',String(reincarnations));
  localStorage.setItem('chin_bonus',String(reincarnBonusPct));
}

// 実ステータス取得（転生ボーナス込み）
function getTBonus(id){ return trainingBonus[id]||{h:0,a:0,d:0,s:0,m:0}; }
function getEffectiveStats(f){
  const mult=1+reincarnBonusPct/100;
  const s=f.stats, tb=getTBonus(f.id);
  return {h:Math.round(s.h*mult)+tb.h, a:Math.round(s.a*mult)+tb.a,
          d:Math.round(s.d*mult)+tb.d, s:Math.round(s.s*mult)+tb.s, m:Math.round(s.m*mult)+tb.m};
}
function getTotalStats(f){ const s=getEffectiveStats(f); return s.h+s.a+s.d+s.s+s.m; }

// ステージ取得
function getStageIdxFor(n){ let s=0; for(let i=0;i<10;i++) if(n>=THRESHOLDS[i]) s=i; return s; }

// 重み付きランダム（条件付きフォーム考慮）
function pickForm(si){
  const pool=STAGE_GROUPS[si];
  const regular=pool.filter(f=>!f.cond);
  const special=pool.filter(f=>f.cond&&checkCondition(f.cond));
  // 特殊条件が満たされていれば20%で登場
  for(const sf of special){ if(Math.random()<0.20) return sf; }
  const total=regular.reduce((a,f)=>a+WEIGHTS[f.rar],0);
  let r=Math.random()*total;
  for(const f of regular){ r-=WEIGHTS[f.rar]; if(r<=0) return f; }
  return regular[regular.length-1];
}

const charEl=document.getElementById('character');
const charG=document.getElementById('charG');
const stageArea=document.getElementById('stageArea');

function applyForm(f,withAnim){
  // 訓練カウントを新フォームへ引き継ぎ
  const oldId=currentForm?currentForm.id:null;
  if(oldId&&oldId!==f.id){
    trainCount[f.id]=(trainCount[f.id]||0)+(trainCount[oldId]||0);
    pendingPts[f.id]=(pendingPts[f.id]||0)+(pendingPts[oldId]||0);
    trainCount[oldId]=0; pendingPts[oldId]=0;
    localStorage.setItem('chin_tcount',JSON.stringify(trainCount));
    localStorage.setItem('chin_tpts',JSON.stringify(pendingPts));
  }
  charG.innerHTML=renderForm(f)+renderEquippedAcc(f);
  if(withAnim){
    charEl.classList.remove('wiggle','evolving');
    void charEl.offsetWidth;
    charEl.classList.add('evolving');
    charEl.addEventListener('animationend',()=>charEl.classList.remove('evolving'),{once:true});
    const[c1,c2]=f.bg||['#ffe0f0','#fff0e0'];
    document.body.style.background=`linear-gradient(135deg,${c1} 0%,${c2} 100%)`;
  }
  currentForm=f;
  discovered.add(f.id);
  saveAll();
}

function updateUI(){
  const si=currentStageIdx;
  document.getElementById('stageLbl').textContent=`Stage ${si} — ${STAGE_NAMES[si]}`;
  const rarLabel=currentForm.rar==='SP'?'<span class="rarity-badge rarity-SP">特殊</span>'
    :`<span class="rarity-badge rarity-${currentForm.rar}">${currentForm.rar}</span>`;
  document.getElementById('formName').innerHTML=currentForm.name+rarLabel;
  document.getElementById('formName').style.color=currentForm.stroke||'#ff4488';

  const evolveRow=document.getElementById('evolveReadyRow');
  if(canEvolve&&si<9){
    document.getElementById('nextInfo').textContent='';
    document.getElementById('progBar').style.width='100%';
    evolveRow.classList.remove('hidden');
    document.getElementById('evolveHint').textContent=`Stage${si} → Stage${si+1} (${STAGE_NAMES[si+1]}) へ進化可能`;
  } else if(si<9){
    const rem=THRESHOLDS[si+1]-count;
    const pct=(count-THRESHOLDS[si])/(THRESHOLDS[si+1]-THRESHOLDS[si])*100;
    document.getElementById('nextInfo').textContent=`あと${rem}回で進化！`;
    document.getElementById('progBar').style.width=Math.min(100,pct)+'%';
    evolveRow.classList.add('hidden');
  } else {
    document.getElementById('nextInfo').textContent='🏆 最強形態！';
    document.getElementById('progBar').style.width='100%';
    evolveRow.classList.add('hidden');
  }
  document.getElementById('countEl').textContent=count;

  // ステータス表示
  const s=getEffectiveStats(currentForm);
  const bonTxt=reincarnBonusPct>0?` <span class="bonus-text">+${reincarnBonusPct.toFixed(1)}%転生ボーナス</span>`:'';
  document.getElementById('statRow').innerHTML=
    `HP:<b>${s.h}</b> ATK:<b>${s.a}</b> DEF:<b>${s.d}</b> SPD:<b>${s.s}</b> STM:<b>${s.m}</b>${bonTxt}`;

  // 転生ボタン
  const rRow=document.getElementById('reincarnRow');
  if(si>=6){
    rRow.classList.remove('hidden');
    document.getElementById('reincarnInfo').textContent=
      `転生${reincarnations}回済 / 転生するとステータス+${(getTotalStats(currentForm)*0.01).toFixed(1)}%ボーナス獲得`;
  } else {
    rRow.classList.add('hidden');
  }
}

const pechiTexts=['ぺちぺち','ぺちっ！','ぺちん','ぺちぺちぺち','ぺち〜','ぺちんっ'];
const pechiColors=['#ff6090','#ff4488','#e060b0','#ff80a0','#cc4480','#ff55aa'];
function spawnText(x,y){
  const el=document.createElement('div');
  el.className='puchi';
  el.textContent=pechiTexts[Math.floor(Math.random()*pechiTexts.length)];
  el.style.cssText=`left:${x-40+(Math.random()-.5)*60}px;top:${y-20}px;color:${pechiColors[Math.floor(Math.random()*pechiColors.length)]};font-size:${1.3+Math.random()*.9}rem`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1200);
}
function showBanner(msg){
  const el=document.createElement('div');
  el.className='evolve-banner';el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2600);
}
function pechipechi(x,y,isAuto=false){
  charEl.classList.remove('wiggle','evolving');
  void charEl.offsetWidth;
  charEl.classList.add('wiggle');
  charEl.addEventListener('animationend',()=>charEl.classList.remove('wiggle'),{once:true});
  const n=1+Math.floor(Math.random()*2);
  for(let i=0;i<n;i++) setTimeout(()=>spawnText(x+(Math.random()-.5)*40,y),i*80);
  count++;
  addTrainPechi();
  // 手動/オート累計
  if(isAuto){ totalAutoPechis++; localStorage.setItem('chin_auto',String(totalAutoPechis)); }
  else { totalManualPechis++; localStorage.setItem('chin_manual',String(totalManualPechis)); }
  // 進化閾値チェック（自動進化しない）
  if(!canEvolve && currentStageIdx<9 && count>=THRESHOLDS[currentStageIdx+1]){
    canEvolve=true;
  }
  updateUI();
}

// 進化ボタン
document.getElementById('btnEvolve').addEventListener('click',()=>{
  if(!canEvolve) return;
  canEvolve=false;
  const newSi=currentStageIdx+1;
  currentStageIdx=newSi;
  const f=pickForm(newSi);
  applyForm(f,true);
  setTimeout(()=>showBanner(`✨ ${f.name} に進化！`),350);
  updateUI();
});

// 転生
document.getElementById('btnReincarn').addEventListener('click',()=>{
  const bonus=(getTotalStats(currentForm)*0.01).toFixed(1);
  if(!confirm(`転生しますか？\n\nぺちぺち回数と進化がリセットされます。\nステータス+${bonus}%のボーナスを永続取得！\n図鑑の記録は保持されます。`)) return;
  reincarnBonusPct+=getTotalStats(currentForm)*0.01;
  reincarnations++;
  if(autoTimer){ clearInterval(autoTimer); autoTimer=null; document.getElementById('btnAuto').textContent='▶ オート'; document.getElementById('btnAuto').classList.remove('on'); }
  count=0; currentStageIdx=0;
  const f=FORMS[0]; applyForm(f,false);
  document.body.style.background=`linear-gradient(135deg,${f.bg[0]} 0%,${f.bg[1]} 100%)`;
  saveAll();
  updateUI();
  showBanner(`🔄 転生！ボーナス+${bonus}% 獲得！`);
});

        +`<div class="fc-name">${isDisc?f.name:'???'}</div>`

        +statsHtml+hintHtml;
      if(isDisc) card.title=f.desc;
      grid.appendChild(card);
    });
    body.appendChild(grid);
  }
}

  document.querySelectorAll('.acc-tab').forEach(t=>{

  // 所持グリッド
  const owned=ACCESSORIES.filter(a=>a.slot===accCurrentSlot&&ownedAcc.has(a.id));

  const grid=document.getElementById('accGrid');

let trainingBonus  = JSON.parse(localStorage.getItem('chin_train')||'{}');
// {formId:{h,a,d,s,m}} – 各フォームの訓練ボーナス（永続）
let trainCount     = JSON.parse(localStorage.getItem('chin_tcount')||'{}');
// {formId:number} – 今サイクルの累積ぺちぺち数
let pendingPts     = JSON.parse(localStorage.getItem('chin_tpts')||'{}');
// {formId:number} – 割り振り待ちのポイント数

function pechisNeeded(f){
  // 基本ステータス合計値に比例（強いほど育ちづらい）
  const base=Object.values(f.stats).reduce((a,b)=>a+b,0);
  return Math.max(100,Math.round(100*base/50));
}

function addTrainPechi(){
  const id=currentForm.id, need=pechisNeeded(currentForm);
  trainCount[id]=(trainCount[id]||0)+1;
  while(trainCount[id]>=need){
    trainCount[id]-=need;
    pendingPts[id]=(pendingPts[id]||0)+1;
  }
  localStorage.setItem('chin_tcount',JSON.stringify(trainCount));
  localStorage.setItem('chin_tpts',JSON.stringify(pendingPts));
  updateTrainBadge();
}

function allocateStat(stat){
  const id=currentForm.id;
  if(!pendingPts[id]||pendingPts[id]<=0) return;
  if(!trainingBonus[id]) trainingBonus[id]={h:0,a:0,d:0,s:0,m:0};
  trainingBonus[id][stat]++;
  pendingPts[id]--;
  localStorage.setItem('chin_train',JSON.stringify(trainingBonus));
  localStorage.setItem('chin_tpts',JSON.stringify(pendingPts));
  updateTrainBadge();
  renderTrainModal();
  updateUI();
}

function updateTrainBadge(){
  const id=currentForm.id, pts=pendingPts[id]||0;
  const badge=document.getElementById('trainBadge');
  if(pts>0){ badge.textContent=pts; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');
}

function renderTrainModal(){
  const id=currentForm.id;
  const need=pechisNeeded(currentForm);
  const cur=trainCount[id]||0, pts=pendingPts[id]||0;
  const tb=getTBonus(id);
  const tbTotal=Object.values(tb).reduce((a,b)=>a+b,0);
  const es=getEffectiveStats(currentForm);
  const esTotal=Object.values(es).reduce((a,b)=>a+b,0);

  document.getElementById('tFormInfo').textContent=
    `📋 ${chinNickname||currentForm.name} / 次の+1まで ${need}ぺちぺち必要`;

  const pendDiv=document.getElementById('tPendingDiv');
  if(pts>0){ pendDiv.textContent=`🎯 割り振れるポイントが ${pts}pt あります！`; pendDiv.classList.remove('hidden'); }
  else pendDiv.classList.add('hidden');

  document.getElementById('tProgFill').style.width=(cur/need*100)+'%';
  document.getElementById('tProgTxt').textContent=`${cur} / ${need} ぺちぺち (${Math.round(cur/need*100)}%)`;

  const STAT_NAMES={h:'HP',a:'ATK',d:'DEF',s:'SPD',m:'STM'};
  const MAX_VAL=esTotal/5*2; // 表示バー最大値
  let rows='';
  for(const k of ['h','a','d','s','m']){
    const base=Math.round(currentForm.stats[k]*(1+reincarnBonusPct/100));
    const bonus=tb[k]||0;
    const total=es[k];
    const pct=Math.min(100,total/MAX_VAL*100);
    rows+=`<div class="t-stat-row">
      <span class="t-stat-name">${STAT_NAMES[k]}</span>
      <div class="t-stat-bar-wrap"><div class="t-stat-bar" style="width:${pct}%"></div></div>
      <span class="t-stat-val">${total}<span style="color:#66aa66;font-size:.6rem">+${bonus}</span></span>
      <button class="t-alloc-btn" onclick="allocateStat('${k}')" ${pts<=0?'disabled':''}>▲</button>
    </div>`;
  }
  document.getElementById('tStatRows').innerHTML=rows;
  document.getElementById('tBonusSum').textContent=
    `訓練ボーナス合計: +${tbTotal} (合計ステータス: ${esTotal})`;
}

let shooting = false;
const DOPYU_WORDS = ['ドピュー！','ドピュッ！','ドバーッ！','びゅーっ！','ドバドバー！'];

function getTipPos() {
  const rect = charEl.getBoundingClientRect();
  // フォームの先端(頭の上部 10%付近)
  return { x: rect.left + rect.width / 2, y: rect.top + rect.height * 0.08 };
}

function spawnDrop(tipX, tipY, delay) {
  setTimeout(() => {
    const el = document.createElement('div');
    el.className = 'drop';
    const size = 8 + Math.random() * 16;
    const angle = -90 + (Math.random() - 0.5) * 70;
    const speed = 300 + Math.random() * 400;
    const rad = angle * Math.PI / 180;
    const vx = Math.cos(rad) * speed;
    const vy = Math.sin(rad) * speed;
    el.style.width = size + 'px';
    el.style.height = (size * (0.8 + Math.random() * 0.6)) + 'px';
    el.style.left = (tipX - size / 2) + 'px';
    el.style.top  = (tipY - size / 2) + 'px';
    document.body.appendChild(el);
    const duration = 800 + Math.random() * 400;
    const startTime = performance.now();
    const gravity = 600;
    function animate(now) {
      const t = (now - startTime) / 1000;
      if (t > duration / 1000) { el.remove(); return; }
      const x = tipX + vx * t;
      const y = tipY + vy * t + 0.5 * gravity * t * t;
      el.style.left    = (x - size / 2) + 'px';
      el.style.top     = (y - size / 2) + 'px';
      el.style.opacity = Math.max(0, 1 - t / (duration / 1000));
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  }, delay);
}

function spawnDopyuText(tipX, tipY) {
  const el = document.createElement('div');
  el.className = 'dopyu-text';
  el.textContent = DOPYU_WORDS[Math.floor(Math.random() * DOPYU_WORDS.length)];
  el.style.left = (tipX - 60 + (Math.random() - 0.5) * 30) + 'px';
  el.style.top  = (tipY - 10) + 'px';
  el.style.fontSize = (1.4 + Math.random() * 0.5) + 'rem';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function shoot() {
  if (shooting) return;
  shooting = true;
  charEl.classList.remove('wiggle', 'shoot');
  void charEl.offsetWidth;
  charEl.classList.add('shoot');
  charEl.addEventListener('animationend', () => charEl.classList.remove('shoot'), { once: true });
  const tip = getTipPos();
  spawnDopyuText(tip.x, tip.y);
  const dropCount = 12 + Math.floor(Math.random() * 8);
  for (let i = 0; i < dropCount; i++) spawnDrop(tip.x, tip.y, i * 40);
  setTimeout(() => { shooting = false; }, 600);
}

// ── バトルロジック ──
function simulateBattle(player, npc) {
  let pH = player.stats.h, nH = npc.stats.h;
  const maxPH = pH, maxNH = nH;
  const log = [];

  const attack = (atk, defDef, rng) => {
    const crit = rng() < atk.stats.m / 180;
    let dmg = Math.max(1, Math.round(atk.stats.a - defDef * 0.5));
    if (crit) dmg = Math.round(dmg * 2);
    return { dmg, crit };
  };

  // シード乱数（再現性あり）
  let seed = player.stats.h + player.stats.a + npc.stats.h + npc.stats.a + 12345;
  const rng = () => { seed = (seed * 1664525 + 1013904223) & 0x7fffffff; return seed / 0x7fffffff; };

  const pFirst = player.stats.s >= npc.stats.s;
  const pDouble = player.stats.s >= npc.stats.s * 1.5;
  const nDouble = npc.stats.s >= player.stats.s * 1.5;

  for (let round = 1; round <= 35 && pH > 0 && nH > 0; round++) {
    log.push({ type:'sep', round });
    const doAttack = (isPlayer) => {
      if (pH <= 0 || nH <= 0) return;
      if (isPlayer) {
        const r = attack(player, npc.stats.d, rng);
        nH = Math.max(0, nH - r.dmg);
        log.push({ type:'atk', by:'p', dmg:r.dmg, crit:r.crit, pH, nH, maxPH, maxNH });
      } else {
        const r = attack(npc, player.stats.d, rng);
        pH = Math.max(0, pH - r.dmg);
        log.push({ type:'atk', by:'n', dmg:r.dmg, crit:r.crit, pH, nH, maxPH, maxNH });
      }
    };
    if (pFirst) {
      doAttack(true);
      if (pDouble) doAttack(true);
      doAttack(false);
      if (nDouble) doAttack(false);
    } else {
      doAttack(false);
      if (nDouble) doAttack(false);
      doAttack(true);
      if (pDouble) doAttack(true);
    }
  }
  const winner = pH > nH ? 'player' : pH < nH ? 'npc' : 'draw';
  return { log, winner, pH: Math.max(0,pH), nH: Math.max(0,nH) };
}

  await animateBattle(result, playerName, npc.name, playerStats.h, npc.stats.h);

  // 結果
  const resEl = document.getElementById('battleResult');
  resEl.classList.remove('hidden');
  if (result.winner === 'player') {
    resEl.className = 'b-result win';
    resEl.textContent = `🎉 ${playerName} の勝利！`;
    battleWins++; localStorage.setItem('b_wins', battleWins);
    // アクセサリードロップ
    const npcIdx = NPCS.indexOf(npc);
    const dropped = dropAccessory(npcIdx);
    if (dropped) {
      const isNew = !ownedAcc.has(dropped.id);
      ownedAcc.add(dropped.id); saveAcc();
      setTimeout(()=>{
        const el=document.createElement('div');
        el.className='acc-drop-banner';
        el.innerHTML=`💍 ${isNew?'NEW! ':''}${dropped.name}をゲット！<br><span style="font-size:.85rem;color:#ffaadd">${dropped.rar==='SR'?'★★★ 超レア！':dropped.rar==='R'?'★★ レア！':'★ ノーマル'}</span>`;
        document.body.appendChild(el);
        setTimeout(()=>el.remove(),2600);
      },1800);
    }
  } else if (result.winner === 'npc') {
    resEl.className = 'b-result lose';
    resEl.textContent = `💀 ${npc.name} の勝利…`;
    battleLosses++; localStorage.setItem('b_losses', battleLosses);
  } else {
    resEl.className = 'b-result draw';
    resEl.textContent = '🤝 引き分け！';
  }
  updateBattleRecord();
  document.getElementById('btnRematch').style.display = 'inline-block';
}

async function animateBattle(result, pName, nName, maxPH, maxNH) {
  const log = document.getElementById('battleLog');
  const delay = ms => new Promise(r => setTimeout(r, ms));
  for (const e of result.log) {
    await delay(e.type==='sep' ? 80 : 380);
    if (e.type === 'sep') {
      const d = document.createElement('div');
      d.className = 'round-sep b-log-entry';
      d.textContent = `── Round ${e.round} ──`;
      log.appendChild(d); log.scrollTop = log.scrollHeight; continue;
    }
    const d = document.createElement('div');
    d.className = 'b-log-entry ' + (e.by==='p' ? 'atk' : 'npc-atk');
    const who = e.by==='p' ? pName : nName;
    const target = e.by==='p' ? nName : pName;
    const critTxt = e.crit ? ' <span class="crit">💥 CRIT!</span>' : '';
    d.innerHTML = `⚔️ <b>${who}</b> → ${target} <b>-${e.dmg}</b>${critTxt}`;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
    // HPバー更新
    document.getElementById('playerHpBar').style.width = (e.pH / maxPH * 100) + '%';
    document.getElementById('playerHpTxt').textContent = `${e.pH}/${maxPH}`;
    document.getElementById('npcHpBar').style.width = (e.nH / maxNH * 100) + '%';
    document.getElementById('npcHpTxt').textContent = `${e.nH}/${maxNH}`;
  }
}

// バトルモーダルイベント
document.getElementById('btnBattle').addEventListener('click', () => {
  renderNpcGrid();
  updateBattleRecord();
  document.getElementById('npcSelect').classList.remove('hidden');
  document.getElementById('battleScreen').classList.add('hidden');
  document.getElementById('battleOverlay').classList.remove('hidden');
});
document.getElementById('battleClose').addEventListener('click', () =>
  document.getElementById('battleOverlay').classList.add('hidden'));
document.getElementById('battleOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('battleOverlay'))
    document.getElementById('battleOverlay').classList.add('hidden');
});
document.getElementById('btnBackNpc').addEventListener('click', () => {
  document.getElementById('battleScreen').classList.add('hidden');
  document.getElementById('npcSelect').classList.remove('hidden');
});
document.getElementById('btnRematch').addEventListener('click', () => {
  if (currentNpc) startBattle(currentNpc);
});

// ── 初期化 ──
applyForm(FORMS[0],false);
applyNickname();
updateUI();
updateTrainBadge();
</script>
</body>
